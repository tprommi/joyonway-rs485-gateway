[platformio]
default_envs = esp32s3_devkitc_ota

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
  -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR

lib_deps =
  https://github.com/knolleary/pubsubclient.git
  adafruit/Adafruit NeoPixel@^1.10.0

; Wenn Ihr Waveshare-Board ein spezielles Board-Manifest hat, passen Sie `board` entsprechend an.

[env:esp32s3_devkit_tty]
upload_protocol = esptool
; Port wird automatisch erkannt - keine Hardcodierung nötig

[env:esp32s3_devkitc_ota]
upload_protocol = espota
upload_port = esp32s3-relay-6ch.local
